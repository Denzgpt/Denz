<style>
/* Layout: paper page; a dark swarm strip on top, then one tab per asset group, one card per holding with a dark forecast panel inside. Same visual language as Paper Trader and The Desk. */
:root{--bg:#f1efe8;--paper:#faf8f2;--ink:#17160f;--mute:#6b6759;--line:#d9d4c4;--gold:#b07d1c;--goldSoft:#f0e6cc;--up:#1f8a5b;--dn:#b3372f;--warn:#b7791f;--cond:#2f5fbf;
--panel:#0f0f0c;--panelInk:#ece8da;--panelMute:#8d8a7b;
--disp:'Bricolage Grotesque',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12110c;--paper:#1a1913;--ink:#efeadb;--mute:#9a9585;--line:#2e2c22;--gold:#d9a441;--goldSoft:#2c2514;--up:#3ec99a;--dn:#f27d73;--warn:#e0a23c;--cond:#7aa2ff;--panel:#080806;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12110c;--paper:#1a1913;--ink:#efeadb;--mute:#9a9585;--line:#2e2c22;--gold:#d9a441;--goldSoft:#2c2514;--up:#3ec99a;--dn:#f27d73;--warn:#e0a23c;--cond:#7aa2ff;--panel:#080806;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(38px,8vw,68px);line-height:.95;letter-spacing:-.03em;margin:6px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
.lede{max-width:64ch;color:var(--mute);font-size:15px;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font:500 12px var(--mono);border:1px solid var(--line);background:var(--paper);padding:5px 10px;border-radius:99px}.chip b{color:var(--gold);font-weight:500}.chip.ro{color:var(--warn);border-color:var(--warn)}
.panel{background:var(--panel);color:var(--panelInk);border-radius:10px;border:1px solid #2a2820}
.swarm{padding:14px;display:flex;flex-direction:column;gap:10px}
.pcap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--panelMute)}.pcap b{color:#d9a441;font-weight:500}
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.bot{border:1px solid #2a2820;border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:0}
.bot .n{display:flex;justify-content:space-between;gap:8px;font-weight:600}.bot p{margin:3px 0 0;color:var(--panelMute)}
.vd{font:500 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase}.vd.pro{color:#3ec99a}.vd.con{color:#f27d73}.vd.neutral{color:#8d8a7b}
.dec{font-size:13px;border-left:3px solid #d9a441;padding-left:10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav button,.seg button{font:500 12px var(--mono);background:var(--paper);border:1px solid var(--line);color:var(--mute);padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button.on,.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.seg{display:flex;gap:6px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:16px}
@media(max-width:560px){main{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sym{font:800 26px var(--disp);letter-spacing:-.02em;line-height:1}.nm{color:var(--mute);font-size:12px;margin-top:3px}
.px{font:800 24px var(--disp);letter-spacing:-.02em;text-align:right;font-variant-numeric:tabular-nums}.px small{font:500 11px var(--mono);color:var(--mute)}.chg{font:500 12px var(--mono);text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}
.call{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--gold);background:var(--goldSoft);border-radius:10px;padding:12px 14px}
.call .big{font:800 clamp(24px,4vw,32px) var(--disp);letter-spacing:-.025em;line-height:1.05;margin:2px 0}
.call .rng{font:500 12px var(--mono);color:var(--mute)}
.pct{font:800 44px var(--disp);letter-spacing:-.04em;line-height:1;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:500 11px var(--mono);padding:2px 8px;border-radius:99px;border:1px solid currentColor;margin-top:4px}
.tag.s3{color:var(--up)}.tag.s2{color:var(--gold)}.tag.s1{color:var(--mute)}
.sum{margin:0;color:var(--ink);font-size:14px;max-width:62ch}
.cv{padding:8px 8px 6px}canvas{width:100%;height:210px;display:block}
.sbar{display:flex;height:24px;gap:3px}.sbar div{display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);background:var(--line);color:var(--mute);border-radius:4px;min-width:0;overflow:hidden}.sbar div.top{background:var(--gold);color:#17160f;font-weight:500}
.slab{display:flex;gap:3px;font:500 10px var(--mono);color:var(--mute);margin-top:-6px}.slab span{text-align:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:clip}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.facts div{border-top:1px solid var(--line);padding-top:5px}.facts span{display:block;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.facts b{font:700 15px var(--disp);font-variant-numeric:tabular-nums}
.note{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--mute)}.note b{color:var(--ink)}
.note.evt{background:var(--goldSoft);color:var(--ink)}
details{font-size:12.5px;color:var(--mute)}summary{cursor:pointer;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase}
table{border-collapse:collapse;width:100%;margin-top:6px;font-variant-numeric:tabular-nums}th,td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line);font-size:12px}th:first-child,td:first-child{text-align:left}
.fresh{font:500 11px var(--mono);color:var(--mute)}.fresh.stale{color:var(--warn)}.err{color:var(--dn);font-size:12px}
.ctl .seg button{padding:6px 12px}
</style>

function chart(cv,d,h){const r=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*r;cv.height=H*r;const x=cv.getContext('2d');x.scale(r,r);

 bars.forEach((b,i)=>{const up=b.c>=b.o;x.strokeStyle=x.fillStyle=up?'#3ec99a':'#f27d73';x.beginPath();x.moveTo(X(i),Y(b.h));x.lineTo(X(i),Y(b.l));x.stroke();x.fillRect(X(i)-bw/2,Math.min(Y(b.o),Y(b.c)),bw,Math.max(1,Math.abs(Y(b.o)-Y(b.c))))});

 x.lineWidth=1;[['p10','rgba(242,125,115,.75)'],['p90','rgba(62,201,154,.75)']].forEach(([k,c])=>{x.strokeStyle=c;x.setLineDash([3,3]);x.beginPath();x.moveTo(X(x0),Y(last));d[k].forEach((v,i)=>x.lineTo(X(x0+1+i),Y(v)));x.stroke()});x.setLineDash([]);

 if(T&&T.path){const e=T.path[T.path.length-1],s1=Math.min(T.to||hi,hi),s0=Math.max(T.from||lo,lo);x.fillStyle='rgba(217,164,65,.14)';x.fillRect(X(tot-1)-8,Y(s1),16,Math.max(2,Y(s0)-Y(s1)));

 (d.levels||[]).forEach((L,k)=>{if(L.price<=lo+pad||L.price>=hi-pad)return;x.strokeStyle='rgba(141,138,123,.55)';x.lineWidth=1;x.setLineDash([1,4]);x.beginPath();x.moveTo(0,Y(L.price));x.lineTo(W-52,Y(L.price));x.stroke();x.setLineDash([]);x.fillStyle='#8d8a7b';x.font='9px IBM Plex Mono,monospace';x.textAlign='left';x.fillText(L.name,6+(k%3)*88,Y(L.price)-3)});
 const last_t=d.bars[n-1].t,perDay=d.horizon>=20&&d.bars.length&&d.bars[1].t-d.bars[0].t<86400?6.5:1;
 ((d.analysis&&d.analysis.events)||[]).forEach(ev=>{const days=(Date.parse(ev.date+'T21:00:00Z')-last_t*1000)/864e5;if(days<0)return;let off=Math.round(days*5/7*perDay);if(off<1)off=1;if(off>hz)return;const ex=X(x0+off);x.strokeStyle=ev.kind=='swarm'?'rgba(242,125,115,.8)':ev.kind=='earnings'?'rgba(217,164,65,.9)':'rgba(122,162,255,.8)';x.lineWidth=1.2;x.setLineDash([5,3]);x.beginPath();x.moveTo(ex,14);x.lineTo(ex,H);x.stroke();x.setLineDash([]);x.fillStyle=x.strokeStyle;x.font='10px IBM Plex Mono,monospace';x.textAlign='center';x.fillText(ev.kind=='earnings'?'EARNINGS':ev.kind=='swarm'?'SWARM':'MACRO',Math.min(Math.max(ex,30),W-80),10)});
